    let clicked = 0; // 0 not clicked, 1 clicked.
    function filter_click(input) {
        if(input != "-") {
            var table = document.getElementById("cecfo-service-tbody");
            if(clicked == 1) {
                clicked = 0;
                reset();
            } else {
                Array.from(table.rows).forEach(row => {
                    Array.from(row.cells).forEach((cell, i) => {
                        if(i === 0) return;
                        if (!cell.innerText.includes(input)) {
                            cell.style.opacity = "0.25";
                        }
                    });
                });
                clicked = 1;
            }
        }
    }

    function filter_hover(input) {
        if(input != "-" && clicked == 0) {
            var table = document.getElementById("cecfo-service-tbody");
            Array.from(table.rows).forEach(row => {
                Array.from(row.cells).forEach((cell, i) => {
                    if(i === 0) return;
                    if (!cell.innerText.includes(input)) {
                        cell.style.opacity = "0.25";
                    }
                });
            });
        }
    }

    function reset() {
        // When clicked was set to 1, disable this function.
        if(clicked == 0) {
            var table = document.getElementById("cecfo-service-tbody");
            Array.from(table.rows).forEach(row => {
                Array.from(row.cells).forEach(cell => {
                    cell.style.opacity = "1";
                });
            });
        }
    }
