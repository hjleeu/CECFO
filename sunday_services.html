    /* When the user click on a single name, the table will highlight all the cells contains this name. Clicking another time, will reset. */
    function filter_click(input) {
        /* Ignore cells that does not contain an acceptable value. */
        if(input != "-") {
            if(clicked == 1) {
                clicked = 0;
                reset();
            } else {
                Array.from(service_table.rows).forEach(row => {
                    Array.from(row.cells).forEach((cell, i) => {
                        if(i === 0) return;
                        if (!cell.innerText.includes(input)) {
                            cell.style.opacity = "0.25";
                        }
                    });
                });
                clicked = 1;
            }
        }
    }

    /* When the user hover a cell with the mouse, all the cells contains this name become highlighted. */
    function filter_hover(input) {
        if(input != "-" && clicked == 0) {
            Array.from(service_table.rows).forEach(row => {
                Array.from(row.cells).forEach((cell, i) => {
                    if(i === 0) return; // Ignore the first colunm.
                    if (!cell.innerText.includes(input)) {
                        cell.style.opacity = "0.25";
                    }
                });
            });
        }
    }

    /* The reset function, called on mouse out and the click when the table is freeze. */

                Array.from(row.cells).forEach(cell => {
                    cell.style.opacity = "1";
                });
            });
        }
    }

    // time complexity: O(NM) (hope so)
    function handle_filter_columns() {
        let checkboxes = document.getElementById("filter_checkboxes").getElementsByClassName("filter_checkbox");
        for (let i = 0; i < checkboxes.length; i++) {
            let cb = checkboxes[i];
            let column = document.getElementById("cecfo-service").getElementsByClassName(cb.value);
            for (let i = 0; i < column.length; i++) {
                if (cb.checked)
                    column[i].style.display = "none";
                else
                    column[i].style.display = "";
            }
        }
    }
</script>
