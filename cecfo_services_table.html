<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>主日聚会事工安排</title>
    <style>
        #i_am_a_container {
            color: #F2B94B
        }

    </style>
</head>
<body>
    <div id="i_am_a_container" class="container-fluid">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        加载中...
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hjleeu/CECFO@b23440ed925590c82d2236a60b1cdf69cac6af1e/cecfo_services.js"></script>
    <script>
        const scriptUrl = "https://script.google.com/macros/s/AKfycbxtK3CsxFygMAXY7UUOaUYpA-AomB7zwRLo6x9elqj_1JA8kV2NDo6_1pknFBzUZDLg/exec";

        async function fetchData() {
            try {
                const response = await fetch(scriptUrl);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching data:', error);
                return [];
            }
        }

        window.onload = async function () {
            const services_list = await fetchData();
            loadData("i_am_a_container", services_list);
        }
    </script>
</body>
</html>
