<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CECFO | DASHBOARD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC&family=ZCOOL+XiaoWei&display=swap');

        :root {
            --bg: #080A0F;
            --surface: #0F1118;
            --border: #1E2230;
            --text: #D8DAE8;
            --highlight: #6b6f78;
            --online: #5AB87A;
            --offline: #E05A5A;
            --muted: #4A4F6A;
            --blue: #5B8FFF;
            --gold: #E8C97A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Noto Serif SC";
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding: 0.37rem 0.73rem; /* Top/Bottom Left/Right. */
            align-items: center;
            font-size: 1.88rem;
        }

        .header-left {
            background-image: linear-gradient(to bottom right, var(--gold), var(--blue));
            color: transparent;
            background-clip: text;
            cursor:default;
        }

        .header-center {
            color: var(--gold);
            text-align: center;
            font-variant-numeric: tabular-nums;
            padding: 0.37rem;
            border-radius: 5px;
            font-size: 1rem;
            cursor: default;
        }

        .header-right {
            display: flex;
            flex-direction: row;
        }

        .header-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--muted);
            padding: 0.15rem 0.35rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .header-btn:hover {
            color: var(--highlight);
            border-color: var(--highlight);
        }

        .content-area {
            display: flex;
            flex-direction: row;
            font-size: 1rem;
            overflow: hidden;
            flex: 1;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            min-width: 15rem;
            border-right: 1px solid var(--border);
            color: var(--highlight);
        }

        .sidebar div {
            padding: 0.66rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            overflow: auto;
            flex: 1;
            align-items: flex-start;
            align-content: flex-start;
        }

        .main-container::-webkit-scrollbar {
            width: 5.37px;
            height: 5.37px;
        }

        .main-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .main-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .main-container::-webkit-scrollbar-thumb:hover {
            background: var(--highlight);
        }

        .column > div {
            border: 1px solid var(--border);
            border-radius: 7px;
            margin: 0.66rem 0.37rem; /* Top/Bottom Left/Right. */
            padding: 0.5rem;
        }

        .worship-container {
            display: flex;
            flex-direction: column;
        }

        .todo-container {
            padding: 0 !important;
        }

        .other_songs-container {
            padding: 0 !important;
        }

        .live-container {
            position: relative;
            aspect-ratio: 16 / 9;
            padding: 0;
            overflow: hidden;
        }

        .live-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 7px;
            pointer-events: none;
            user-select: none;
        }

        .container-heading {
            font-size: 1.37rem;
            display: block;
            margin-bottom: 0.66rem;
            color: var(--gold);
            cursor: default;
        }

        .identity-card {
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 0.37rem;
            position: relative;
            display: inline-block;
            cursor: pointer;
            margin: 0.15rem;
            background: var(--surface);
        }

        .tooltip-text {
            visibility: hidden;
            position: absolute;
            z-index: 1;
            background: var(--surface);
            color: var(--highlight);
            padding: 0.37rem;
            border-radius: 7px;
            top: 101%;
            left: 50%;
            transform: translateX(-50%);
            text-wrap-mode: nowrap;
            font-size: 0.73rem;
        }

        .identity-card:hover {
            transform: translateY(-1px);
            border-color: var(--highlight);
        }

        .identity-card:hover .tooltip-text {
            visibility: visible;
        }

        .song-card {
            border-block: 1px solid var(--border);
            display: flex;
            flex-direction: row;
            flex: 1;
            align-items: center;
        }

        .song-card > * {
            border-inline: 1px solid var(--border);
        }

        .song-card .song-name {
            flex-grow: 1;
            padding-left: 0.37rem;
        }

        .song-card .song-btn {
            cursor: pointer;
            text-decoration: none;
        }

        .switch-head {
            display: flex;
            flex-direction: row;
        }

        .switch-head > span {
            border: 1px solid var(--border);
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.15s;
            flex-grow: 1;
            text-align: center;
        }

        .switch-head > span.active {
            opacity: 1;
            border-color: var(--gold);
        }

        .tab-content {
            display: none;
        }

        .scripture {
            color: var(--blue);
        }

        .no-data {
            color: var(--muted);
        }

        #main-container-left {
            width: 18rem;
        }

        #main-container-center {
            flex-grow: 1;
        }

        #main-container-right {
            width: 18rem;
        }

        #worship_teammates {
            margin: 0.37rem;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        #worship_song_list {
            flex: 1;
            align-items: stretch;
            display: flex;
            flex-direction: column;
        }

        #notes-area {
            outline: none;
            width: 100%;
            min-height: 7rem;
            resize: none;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 0.15rem;
        }

        #notes-area:focus {
            border-color: var(--highlight);
        }

        @media (max-width: 1000px) {
            .sidebar { display: none; }
            .main-container { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <span>CECFO | DASHBOARD</span>
        </div>
        <div class="header-center" id="header-clock"></div>
        <div class="header-right">
            <button class="header-btn">⛶</button>
        </div>
    </div>
    <div class="content-area">
        <div class="sidebar">
            <div>
                <span>总览 | Overview</span>
            </div>
        </div>
        <div class="main-container">
            <div class="column" id="main-container-left">
                <div class="service_list-container" id="service_list-container">
                    <span class="container-heading">本周服事人员</span>
                </div>
                <div class="notes-container">
                    <span class="container-heading">备注</span>
                    <textarea id="notes-area" placeholder="备注事件"></textarea>
                </div>
            </div>
            <div class="column" id="main-container-center">
                <div class="live-container" id="live-container"></div>
                <div class="worship-container" id="worship-container">
                    <span class="container-heading">本周敬拜团</span>
                </div>
                <div class="sermon-container" id="sermon-container">
                    <span class="container-heading">本周证道·信息分享</span>
                </div>
            </div>
            <div class="column" id="main-container-right">
                <div class="todo-container">
                    <div class="switch-head" id="switch-head-todo">
                        <span class="container-heading active" data-tab="todo-pre" style="border-radius: 7px 0 0 0;">准备工作</span>
                        <span class="container-heading" data-tab="todo-post" style="border-radius: 0 7px 0 0;">收尾工作</span>
                    </div>
                    <div class="tab-content" id="tab-todo-pre"></div>
                    <div class="tab-content" id="tab-todo-post"></div>
                </div>
                <div class="other_songs-container">
                    <div class="switch-head" id="switch-head-other_songs">
                        <span class="container-heading active" data-tab="emcee" style="border-radius: 7px 0 0 0;">主持</span>
                        <span class="container-heading" data-tab="choir" style="border-radius: 0 7px 0 0;">献诗</span>
                    </div>
                    <div class="tab-content" id="tab-emcee"></div>
                    <div class="tab-content" id="tab-choir"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Demo for testing.
        const demo = {
            "worship_team": [
                { "icon": "🔰", "role": "主领", "assigned": "柯铭" },
                { "icon": "🎹", "role": "琴", "assigned": "柳安琪" },
                { "icon": "🥁", "role": "鼓", "assigned": "陈佳怡" },
                { "icon": "🎸", "role": "吉他", "assigned": "" },
                { "icon": "🎸", "role": "贝斯", "assigned": "" },
                { "icon": "🎤", "role": "领唱", "assigned": "季凯静" },
                { "icon": "🎤", "role": "领唱", "assigned": "吴佳怡" },
                { "icon": "🎤", "role": "领唱", "assigned": "吴优" }
            ],
            "worship_song": [
                { "name": "弹琴歌唱赞美祢 | Praise Him", "yt_url": "https://youtu.be/homljdAOovs?si=OGe6_6r9wk1rUC6Q", "img_url": "https://cloud.aleleeu.it/s/H92gg9iRE2R3tgd" },
                { "name": "因祂活着 | Because He lives", "yt_url": "https://youtu.be/Mk_wb6RvHM8?si=rqKLAhbD8KSAG2wI", "img_url": "https://cloud.aleleeu.it/s/cxYAbxT7Hx7NZF4" },
                { "name": "在耶稣里彼此相爱 | Let Us Love", "yt_url": "https://youtu.be/w7LiijVv_R8?si=gr6iEpVRnvbX3psr", "img_url": "https://cloud.aleleeu.it/s/Ja8FmsqWzpQwE7Q" }
            ],
            "service_list": [
                { "icon": "👨🏻‍💼", "role": "主持人", "assigned": "陈章" },
                { "icon": "🙏🏻", "role": "敬拜祷告", "assigned": "" },
                { "icon": "🙏🏻", "role": "记念祷告", "assigned": "胡莉莉" },
                { "icon": "📖", "role": "读经", "assigned": "胡杰 | 彼前4:1-19节" },
                { "icon": "🏫", "role": "主日学大班", "assigned": "柳徐康" },
                { "icon": "🏫", "role": "主日学中班", "assigned": "季凯伦" },
                { "icon": "🏫", "role": "主日学小班", "assigned": "季艳芬" },
                { "icon": "🧹", "role": "值日", "assigned": "陈章" },
                { "icon": "🧹", "role": "值日", "assigned": "张雪琴" },
                { "icon": "🤝🏻", "role": "接待", "assigned": "厉子浩" },
                { "icon": "🤝🏻", "role": "接待", "assigned": "柳美灵" },
            ],
            "live_url": "https://www.youtube.com/embed/gn1lR4QgTAc",
            "sermon_outline": {
                "pastor": "潘胜洁",
                "title": "耶稣，是超越一切的主",
                "scripture": "约翰福音5章1-8节",
                "points": [
                    { "text": "超越外在的物质" },
                    { "text": "超越世间的冷漠" },
                    { "text": "超越短暂的今生" },
                    { "text": "超越狭隘的观念" },
                    
                ]
            },
            "todo_pre": [
                { "text": "打开调音桌电闸" },
                { "text": "开启调音桌所有电源开关" },
                { "text": "开启调音台" },
                { "text": "打开音箱电闸" },
                { "text": "开启其他设备" },
                { "text": "准备PPT" },
                { "text": "准备练习所需设备" },
                { "text": "准备直播" }
            ],
            "todo_post": [
                { "text": "关闭直播" },
                { "text": "回收设备" },
                { "text": "关旁听/音箱" },
                { "text": "关调音台" },
                { "text": "关其他设备" },
                { "text": "关调音桌电板开关" },
                { "text": "关调音桌电闸" },
            ],
            "emcee_song": [],
            "choir_song": []
        };

        /**
         * @param id Container id.
         * @param team Array containing the team data for fill up.
         * @param songs Array containing the song data for fill up.
        */
        function fillWorshipContainer(id, team, songs) {
            let container = document.getElementById(id);

            let teammates = document.createElement("div");
            teammates.id = "worship_teammates";

            team.forEach(e => {
                if(e.assigned !== "" && e.assigned !== null) {
                    let teammate = document.createElement("span");
                    teammate.className = "identity-card";
                    teammate.textContent = e.icon + " " + e.assigned;

                    let tooltip = document.createElement("span");
                    tooltip.className = "tooltip-text";
                    tooltip.textContent = e.role;
                    teammate.appendChild(tooltip);

                    teammates.appendChild(teammate);
                }
            });
            container.appendChild(teammates);

            container.appendChild(renderSongList(songs));
        }

        /**
         * @param id Container id.
         * @param data Array of data for fill up.
        */
        function fillServiceListContainer(id, data) {
            let container = document.getElementById(id);

            data.forEach(e => {
                let staff = document.createElement("span");
                staff.className = "identity-card";
                staff.textContent = e.icon + " " +e.role + ": " + (e.assigned !== "" ? e.assigned : "-");
                container.appendChild(staff);
            });
        }

        function fillLiveContainer(id, url) {
            let container = document.getElementById(id);

            container.innerHTML = `
                <iframe src="${url}?autoplay=1&mute=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            `;
        }

        function fillSermonContainer(id, data) {
            let container = document.getElementById(id);

            let pastor = document.createElement("span");
            pastor.className = "identity-card";
            pastor.textContent = "👨🏻‍💼 " + data.pastor;
            pastor.style.display = "table";
            container.appendChild(pastor);
            
            let title = document.createElement("span");
            title.textContent = data.title + " | ";

            let scripture = document.createElement("span");
            scripture.className = "scripture";
            scripture.textContent = data.scripture;
            container.appendChild(title);
            container.appendChild(scripture);
            container.appendChild(renderSermonPoints(data.points));
        }

        function fillToDoContainer(tab_pre_id, tab_post_id, todo_pre, todo_post) {
            let tab_pre = document.getElementById(tab_pre_id);
            let tab_post = document.getElementById(tab_post_id);

            tab_pre.appendChild(renderSermonPoints(todo_pre));
            tab_post.appendChild(renderSermonPoints(todo_post));
        }

        function fillOtherSongsContainer(tab_emcee_id, tab_choir_id, emcee_data, choir_data) {
            let tab_emcee = document.getElementById(tab_emcee_id);
            let tab_choir = document.getElementById(tab_choir_id);

            tab_emcee.appendChild(renderSongList(emcee_data));
            tab_choir.appendChild(renderSongList(choir_data));
        }

        function renderSermonPoints(points) {
            const ol = document.createElement("ol");
            ol.style.paddingLeft = "1.37rem"

            points.forEach(point => {
                const li = document.createElement("li");
                li.textContent = point.text;

                if (point.points && point.points.length > 0) {
                    li.appendChild(renderSermonPoints(point.points));
                }

                ol.appendChild(li);
            });

            return ol;
        }

        function renderSongList(songs) {
            let song_list = document.createElement("div");
            song_list.id = "worship_song_list";

            if(songs.length > 0) {
                songs.forEach(e => {
                    let song = document.createElement("div");
                    song.className = "song-card";

                    let name = document.createElement("span");
                    name.className = "song-name";
                    name.textContent = "♫ " + e.name;

                    let music = document.createElement("a");
                    music.className = "song-btn";
                    music.textContent = "🔊";
                    music.href = e.yt_url;

                    let image = document.createElement("a");
                    image.className = "song-btn";
                    image.textContent = "📜";
                    image.href = e.img_url;

                    song.appendChild(name);
                    song.appendChild(music);
                    song.appendChild(image);

                    song_list.appendChild(song);
                });
            } else {
                song_list.className = "no-data";
                song_list.textContent = "暂无数据";
            }
            return song_list;
        }

        function updateClock() {
            let now = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
            document.getElementById("header-clock").textContent = now;
        }

        function initSwitchHeader(id, tabs) {
            let switchHead = document.getElementById(id);

            document.getElementById("tab-" + switchHead.querySelector("span.active").dataset.tab).style.display = "block";

            switchHead.querySelectorAll("span").forEach(tab => {
                tab.addEventListener("click", () => {
                    switchHead.querySelectorAll("span").forEach(t => t.classList.remove("active"));
                    tab.classList.add("active");

                    tabs.forEach(t => document.getElementById(t).style.display = "none");
                    document.getElementById("tab-" + tab.dataset.tab).style.display = "block";
                });
            });
        }

        updateClock();
        setInterval(updateClock, 1000);

        initSwitchHeader("switch-head-todo", ["tab-todo-pre", "tab-todo-post"]);
        initSwitchHeader("switch-head-other_songs", ["tab-emcee", "tab-choir"]);

        fillWorshipContainer("worship-container", demo.worship_team, demo.worship_song);
        fillServiceListContainer("service_list-container", demo.service_list);
        fillLiveContainer("live-container", demo.live_url);
        fillSermonContainer("sermon-container", demo.sermon_outline);
        fillToDoContainer("tab-todo-pre", "tab-todo-post", demo.todo_pre, demo.todo_post);
        fillOtherSongsContainer("tab-emcee", "tab-choir", demo.emcee_song, demo.choir_song);
    </script>
</body>
</html>
