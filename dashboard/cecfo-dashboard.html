<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CECFO | DASHBOARD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC&family=ZCOOL+XiaoWei&display=swap');

        :root {
            --bg: #080A0F;
            --surface: #0F1118;
            --border: #1E2230;
            --text: #D8DAE8;
            --highlight: #6b6f78;
            --online: #5AB87A;
            --offline: #E05A5A;
            --muted: #4A4F6A;
            --blue: #5B8FFF;
            --gold: #E8C97A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Noto Serif SC";
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding: 0.37rem 0.73rem; /* Top/Bottom Left/Right. */
            align-items: center;
            font-size: 1.73rem;
        }

        .header-left {
            background-image: linear-gradient(to bottom right, var(--gold), var(--blue));
            color: transparent;
            background-clip: text;
            cursor:default;
        }

        .header-center {
            color: var(--gold);
            text-align: center;
            font-variant-numeric: tabular-nums;
            padding: 0.37rem;
            border-radius: 5px;
            font-size: 1rem;
            cursor: default;
        }

        .header-right {
            display: flex;
            flex-direction: row;
        }

        .header-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--muted);
            padding: 0.15rem 0.35rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .header-btn:hover {
            color: var(--highlight);
            border-color: var(--highlight);
        }

        .content-area {
            display: flex;
            flex-direction: row;
            font-size: 0.88rem;
            overflow: hidden;
            flex: 1;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            min-width: 15rem;
            border-right: 1px solid var(--border);
            color: var(--highlight);
        }

        .sidebar div {
            padding: 0.66rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            overflow: auto;
            flex: 1;
            align-items: flex-start;
            align-content: flex-start;
        }

        .main-container::-webkit-scrollbar {
            width: 5.37px;
            height: 5.37px;
        }

        .main-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .main-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .main-container::-webkit-scrollbar-thumb:hover {
            background: var(--highlight);
        }

        .column > div {
            border: 1px solid var(--border);
            border-radius: 7px;
            margin: 0.66rem 0.37rem; /* Top/Bottom Left/Right. */
            padding: 0.5rem;
        }

        .worship-container {
            display: flex;
            flex-direction: column;
        }

        .todo-container {
            padding: 0 !important;
        }

        .other_songs-container {
            padding: 0 !important;
        }

        .live-container {
            display: flex;
            flex-direction: column;
            padding: 0 !important;
            overflow: hidden;
        }

        #live-preview {
            width: 100%;
            aspect-ratio: 16 / 9;
            position: relative;
            user-select: none;
            pointer-events: none;
        }

        #live-preview iframe {
            position: absolute;
            top: 0;
            left: 0;
            border: none;
        }

        .live-controls {
            display: flex;
            flex-direction: row;
            border-top: 1px solid var(--border);
        }

        .live-controls button {
            flex: 1;
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            cursor: pointer;
            padding: 0.37rem 0.73rem;
            transition: all 0.15s;
        }

        .live-controls button:first-child {
            border-radius: 0 0 0 7px;
        }

        .live-controls button:last-child {
            border-radius: 0 0 7px 0;
        }

        .live-controls button:hover {
            border-color: var(--highlight);
        }

        .container-heading {
            font-size: 1.29rem;
            display: block;
            margin-bottom: 0.66rem;
            color: var(--gold);
            cursor: default;
        }

        .identity-card {
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 0.37rem;
            position: relative;
            display: inline-block;
            cursor: pointer;
            margin: 0.15rem;
            background: var(--surface);
        }

        .tooltip-text {
            visibility: hidden;
            position: absolute;
            z-index: 1;
            background: var(--surface);
            color: var(--highlight);
            padding: 0.37rem;
            border-radius: 7px;
            top: 101%;
            left: 50%;
            transform: translateX(-50%);
            text-wrap-mode: nowrap;
            font-size: 0.73rem;
        }

        .identity-card:hover {
            transform: translateY(-1px);
            border-color: var(--highlight);
        }

        .identity-card:hover .tooltip-text {
            visibility: visible;
        }

        .song-card {
            border-block: 1px solid var(--border);
            display: flex;
            flex-direction: row;
            flex: 1;
            align-items: center;
        }

        .song-card > * {
            border-inline: 1px solid var(--border);
            padding: 0.15rem;
        }

        .song-card .song-name {
            flex-grow: 1;
            padding-left: 0.37rem;
        }

        .song-card .song-btn {
            cursor: pointer;
            text-decoration: none;
        }

        .switch-head {
            display: flex;
            flex-direction: row;
        }

        .switch-head > span {
            border: 1px solid var(--border);
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.15s;
            flex-grow: 1;
            text-align: center;
        }

        .switch-head > span.active {
            opacity: 1;
            border-color: var(--gold);
        }

        .tab-content {
            display: none;
        }

        .scripture {
            color: var(--blue);
        }

        .no-data {
            color: var(--muted);
        }

        #main-container-left {
            width: 18rem;
        }

        #main-container-center {
            flex-grow: 1;
        }

        #main-container-right {
            width: 18rem;
        }

        #worship_teammates {
            margin: 0.37rem;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        #worship_song_list {
            flex: 1;
            align-items: stretch;
            display: flex;
            flex-direction: column;
        }

        #notes-area {
            outline: none;
            width: 100%;
            min-height: 7rem;
            resize: none;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 0.15rem;
        }

        #notes-area:focus {
            border-color: var(--highlight);
        }

        @media (max-width: 1000px) {
            .sidebar { display: none; }
            .main-container { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <span>CECFO | DASHBOARD</span>
        </div>
        <div class="header-center" id="header-clock"></div>
        <div class="header-right">
            <button class="header-btn" id="fullscreen-btn">⛶</button>
        </div>
    </div>
    <div class="content-area">
        <div class="sidebar">
            <div>
                <span>总览 | Overview</span>
            </div>
        </div>
        <div class="main-container">
            <div class="column" id="main-container-left">
                <div class="service_list-container" id="service_list-container">
                    <span class="container-heading">服事人员 | Services</span>
                </div>
                <div class="notes-container">
                    <span class="container-heading">备注 | Notes</span>
                    <textarea id="notes-area" placeholder="备注事件"></textarea>
                </div>
            </div>
            <div class="column" id="main-container-center">
                <div class="live-container" id="live-container">
                    <div id="live-preview"></div>
                    <div class="live-controls">
                        <button id="liveMuteBtn" onclick="liveMute()">🔊</button>
                        <button id="livePlayBtn" onclick="livePlay()">▶</button>
                        <button id="liveUrlBtn" onclick="liveShareUrl()">🔗</button>
                    </div>
                </div>
                <div class="worship-container" id="worship-container">
                    <span class="container-heading">敬拜团 | Worship Team</span>
                </div>
                <div class="sermon-container" id="sermon-container">
                    <span class="container-heading">证道·信息分享 | Sermon</span>
                </div>
            </div>
            <div class="column" id="main-container-right">
                <div class="todo-container">
                    <div class="switch-head" id="switch-head-todo">
                        <span class="container-heading active" data-tab="todo-pre" style="border-radius: 7px 0 0 0;">准备工作</span>
                        <span class="container-heading" data-tab="todo-post" style="border-radius: 0 7px 0 0;">收尾工作</span>
                    </div>
                    <div class="tab-content" id="tab-todo-pre"></div>
                    <div class="tab-content" id="tab-todo-post"></div>
                </div>
                <div class="other_songs-container">
                    <div class="switch-head" id="switch-head-other_songs">
                        <span class="container-heading active" data-tab="emcee" style="border-radius: 7px 0 0 0;">主持</span>
                        <span class="container-heading" data-tab="choir" style="border-radius: 0 7px 0 0;">献诗</span>
                    </div>
                    <div class="tab-content" id="tab-emcee"></div>
                    <div class="tab-content" id="tab-choir"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const DATA_URL = "https://raw.githubusercontent.com/hjleeu/CECFO/refs/heads/main/weekly_details/2026-06-07.json";

        /**
         * @param id Container id.
         * @param team Array containing the team data for fill up.
         * @param songs Array containing the song data for fill up.
        */
        function fillWorshipContainer(id, team, songs) {
            let container = document.getElementById(id);

            let teammates = document.createElement("div");
            teammates.id = "worship_teammates";

            team.forEach(e => {
                if(e.assigned !== "" && e.assigned !== null) {
                    let teammate = document.createElement("span");
                    teammate.className = "identity-card";
                    teammate.textContent = e.icon + " " + e.assigned;

                    let tooltip = document.createElement("span");
                    tooltip.className = "tooltip-text";
                    tooltip.textContent = e.role;
                    teammate.appendChild(tooltip);

                    teammates.appendChild(teammate);
                }
            });
            container.appendChild(teammates);

            container.appendChild(renderSongList(songs));
        }

        /**
         * @param id Container id.
         * @param data Array of data for fill up.
        */
        function fillServiceListContainer(id, data) {
            let container = document.getElementById(id);

            if(data) data.forEach(e => {
                let staff = document.createElement("span");
                staff.className = "identity-card";
                staff.textContent = e.icon + " " +e.role + ": " + (e.assigned !== "" ? e.assigned : "-");
                container.appendChild(staff);
            });
        }

        let live_player;

        function fillLiveContainer(videoId) {
            live_player = new YT.Player("live-preview", {
                videoId: videoId,
                playerVars: {
                    "controls": 0,
                    "disablekb": 1, // Disable keyboard.
                    "fs": 0, // Disable full screen button.
                    "rel": 0, // Will display related videos only from the same channel.
                },
                events: {
                    onReady: (e) => e.target.playVideo()
                }
            });
        }

        function liveMute() {
            live_player.isMuted() ? live_player.unMute() : live_player.mute();
        }

        function livePlay() {
            live_player.getPlayerState() === YT.PlayerState.PLAYING ? live_player.pauseVideo() : live_player.playVideo();
        }

        function liveShareUrl() {
            const url = `https://www.youtube.com/watch?v=${live_id}`;
            navigator.clipboard.writeText(url);

            const btn = document.getElementById("liveUrlBtn");
            btn.textContent = "✅";
            setTimeout(() => btn.textContent = "🔗", 1500);
        }

        function fillSermonContainer(id, data) {
            let container = document.getElementById(id);

            let pastor = document.createElement("span");
            pastor.className = "identity-card";
            pastor.textContent = "👨🏻‍💼 " + data.pastor;
            pastor.style.display = "table";
            container.appendChild(pastor);
            
            let title = document.createElement("span");
            title.textContent = data.title + " | ";

            let scripture = document.createElement("span");
            scripture.className = "scripture";
            scripture.textContent = data.scripture;
            container.appendChild(title);
            container.appendChild(scripture);
            container.appendChild(renderPoints(data.points));
        }

        function fillToDoContainer(tab_pre_id, tab_post_id, todo_pre, todo_post) {
            let tab_pre = document.getElementById(tab_pre_id);
            let tab_post = document.getElementById(tab_post_id);

            tab_pre.appendChild(renderPoints(todo_pre));
            tab_post.appendChild(renderPoints(todo_post));
        }

        function fillOtherSongsContainer(tab_emcee_id, tab_choir_id, emcee_data, choir_data) {
            let tab_emcee = document.getElementById(tab_emcee_id);
            let tab_choir = document.getElementById(tab_choir_id);

            if(emcee_data !== null) tab_emcee.appendChild(renderSongList(emcee_data));
            if(choir_data !== null) tab_choir.appendChild(renderSongList(choir_data));
        }

        function renderPoints(points) {
            const ol = document.createElement("ol");
            ol.style.paddingLeft = "1.66rem"

            if(points) points.forEach(point => {
                const li = document.createElement("li");
                li.textContent = point.text + (point.it != null ? " | " + point.it : "");

                if (point.points && point.points.length > 0) {
                    li.appendChild(renderPoints(point.points));
                }

                ol.appendChild(li);
            });

            return ol;
        }

        function renderSongList(songs) {
            let song_list = document.createElement("div");
            song_list.id = "worship_song_list";

            if(songs && songs.length > 0) {
                songs.forEach(e => {
                    let song = document.createElement("div");
                    song.className = "song-card";

                    let name = document.createElement("span");
                    name.className = "song-name";
                    name.textContent = "🎶 " + e.name;

                    let music = document.createElement("a");
                    music.className = "song-btn";
                    music.textContent = "🎵";
                    music.href = e.yt_url;
                    music.title = `Youtube链接 - ${e.name}`;

                    let image = document.createElement("a");
                    image.className = "song-btn";
                    image.textContent = "🖼️";
                    image.href = e.img_url;
                    image.title = `歌谱链接 - ${e.name}`;

                    song.appendChild(name);
                    song.appendChild(music);
                    song.appendChild(image);

                    song_list.appendChild(song);
                });
            } else {
                song_list.className = "no-data";
                song_list.textContent = "暂无数据";
            }
            return song_list;
        }

        function updateClock() {
            let now = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
            document.getElementById("header-clock").textContent = now;
        }

        function initSwitchHeader(id, tabs) {
            let switchHead = document.getElementById(id);

            document.getElementById("tab-" + switchHead.querySelector("span.active").dataset.tab).style.display = "block";

            switchHead.querySelectorAll("span").forEach(tab => {
                tab.addEventListener("click", () => {
                    switchHead.querySelectorAll("span").forEach(t => t.classList.remove("active"));
                    tab.classList.add("active");

                    tabs.forEach(t => document.getElementById(t).style.display = "none");
                    document.getElementById("tab-" + tab.dataset.tab).style.display = "block";
                });
            });
        }

        let live_id = null;
        function onYouTubeIframeAPIReady() {
            if(live_id) fillLiveContainer(live_id);
        }

        document.getElementById("fullscreen-btn").addEventListener("click", () => {
            if(!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.getElementById("fullscreen-btn").textContent = "✕";
            } else {
                document.exitFullscreen();
                document.getElementById("fullscreen-btn").textContent = "⛶";
            }
        });

        updateClock();
        setInterval(updateClock, 1000);

        window.onload = async function () {
            await fetch(DATA_URL)
                .then(res => res.json())
                .then(data => {
                    live_id = data.live_id;

                    if (typeof YT !== "undefined" && YT.Player) {
                        fillLiveContainer(data.live_id);
                    }

                    fillWorshipContainer("worship-container", data.worship_team, data.worship_songs);
                    fillServiceListContainer("service_list-container", data.services_list);
                    fillSermonContainer("sermon-container", data.sermon_outline);
                    fillToDoContainer("tab-todo-pre", "tab-todo-post", data.todo_pre, data.todo_post);
                    fillOtherSongsContainer("tab-emcee", "tab-choir", data.emcee, data.choir);

                    initSwitchHeader("switch-head-todo", ["tab-todo-pre", "tab-todo-post"]);
                    initSwitchHeader("switch-head-other_songs", ["tab-emcee", "tab-choir"]);
                })
                .catch(err => console.log("Failed to load data: ", err));
        }
    </script>
</body>
</html>
